name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_static_export: ${{ steps.static.outputs.exists }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build with Next.js
      run: NODE_ENV=production npm run build

    - name: Check for static export
      id: static
      run: echo "exists=$([ -d out ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      
    - name: Setup Pages
      if: steps.static.outputs.exists == 'true'
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      if: steps.static.outputs.exists == 'true'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.has_static_export == 'true'
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4 